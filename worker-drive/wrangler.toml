name = "momentum-google-drive"
main = "src/index.js"
compatibility_date = "2024-11-01"

# SEPARATE Drive OAuth broker — independent from the production Tasks worker
# (momentum-google). Different Google project (Obsidian-GDrive), different secrets, different
# host. Nothing here touches the 1800 Tasks users.
workers_dev = true

# Custom domain for the Drive broker. Must match AUTH_HOST in src/config.js.
# First-level subdomain of jnagase.com so Cloudflare Universal SSL covers it automatically.
[[routes]]
pattern = "momentumlife-drive.jnagase.com"
custom_domain = true

# Secrets (set with wrangler, NOT here) — these hold the Obsidian-GDrive client, NOT production:
#   npx wrangler secret put GOOGLE_CLIENT_ID       (the Obsidian-GDrive Web client ID)
#   npx wrangler secret put GOOGLE_CLIENT_SECRET   (its secret)
